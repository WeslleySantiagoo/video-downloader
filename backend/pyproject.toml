[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "baixai-backend"
version = "0.1.0"
description = "API e worker do Baixaí"
requires-python = ">=3.12"
dependencies = [
  "boto3>=1.35,<2",
  "celery[redis]>=5.4,<6",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic-settings>=2.6,<3",
  "python-multipart>=0.0.12,<1",
  "redis>=5.2,<6",
  "uvicorn[standard]>=0.32,<1",
  "yt-dlp>=2025.1.15",
]

[project.optional-dependencies]
dev = [
  "fakeredis>=2.26,<3",
  "mypy>=1.13,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "pytest-cov>=6,<7",
  "ruff>=0.8,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
