name: Release beta APK

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    uses: ./.github/workflows/android-release.yml
    with:
      version_name: 0.1.${{ github.run_number }}-beta
      tag_name: v0.1.${{ github.run_number }}-beta
      asset_name: WesDownloader-v0.1.${{ github.run_number }}-beta-universal.apk
      prerelease: true
    secrets: inherit
