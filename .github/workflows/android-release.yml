name: Android release reusable

on:
  workflow_call:
    inputs:
      version_name:
        required: true
        type: string
      tag_name:
        required: true
        type: string
      asset_name:
        required: true
        type: string
      prerelease:
        required: true
        type: boolean
    secrets:
      ANDROID_KEYSTORE_BASE64:
        required: false
      ANDROID_KEYSTORE_PASSWORD:
        required: false
      ANDROID_KEY_ALIAS:
        required: false
      ANDROID_KEY_PASSWORD:
        required: false

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" || -z "$KEYSTORE_PASSWORD" || -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" ]]; then
            echo "Configure os quatro secrets ANDROID_KEYSTORE_* antes de publicar." >&2
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/wesdownloader-release.jks"

      - name: Calculate Android version
        run: |
          commit_count="$(git rev-list --count HEAD)"
          echo "WES_VERSION_CODE=$commit_count" >> "$GITHUB_ENV"
          echo "WES_VERSION_NAME=${{ inputs.version_name }}" >> "$GITHUB_ENV"

      - name: Test, lint and build signed APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/wesdownloader-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebugAndroidTest lintRelease assembleRelease

      - name: Prepare release files
        run: |
          mkdir -p release
          cp app/build/outputs/apk/release/app-release.apk "release/${{ inputs.asset_name }}"
          cd release
          sha256sum "${{ inputs.asset_name }}" > "${{ inputs.asset_name }}.sha256"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.tag_name }}-universal-apk
          path: release/*
          if-no-files-found: error

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ inputs.tag_name }}
          ASSET_NAME: ${{ inputs.asset_name }}
          IS_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" "release/$ASSET_NAME" "release/$ASSET_NAME.sha256" --clobber
          elif [[ "$IS_PRERELEASE" == "true" ]]; then
            gh release create "$TAG_NAME" "release/$ASSET_NAME" "release/$ASSET_NAME.sha256" \
              --target "$GITHUB_SHA" --title "WesDownloader $TAG_NAME" --generate-notes --prerelease
          else
            gh release create "$TAG_NAME" "release/$ASSET_NAME" "release/$ASSET_NAME.sha256" \
              --target "$GITHUB_SHA" --title "WesDownloader $TAG_NAME" --generate-notes --latest
          fi
